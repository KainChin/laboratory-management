server:
  port: 6868

spring:
  application:
    name: test-order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/test-order-service
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

# Instrument Service and waiting configuration
instrument:
  base-url: http://localhost:8081
  timeout-ms: 3000
  retry:
    max-attempts: 3
    backoff-ms: 500

wait:
  poll-interval-ms: 5000
  max-wait-ms: 600000