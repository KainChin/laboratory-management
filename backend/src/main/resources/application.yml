server:
  port: 6868

spring:
  application:
    name: test-order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/test-order-service
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always